[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vvf-publishers"
version = "0.1.0"
description = "Platform publishers (YouTube/TikTok/Instagram) for Viral Video Factory. Runs on the render PC."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "vvf-contracts",
    "vvf-shared",
]

[tool.setuptools.packages.find]
where = ["src"]
