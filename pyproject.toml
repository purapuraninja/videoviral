[project]
name = "viral-video-factory"
version = "0.1.0"
description = "Orchestration repo for wigolo + MoneyPrinterTurbo viral video pipeline"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["packages/contracts/src", "packages/database/src", "packages/shared/src", "integrations/wigolo/src", "integrations/money-printer-turbo/src", "apps/api/src", "apps/discovery-worker/src", "apps/local-render-agent/src"]
