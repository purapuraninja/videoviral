name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx fastapi 'pydantic>=2.6' pydantic-settings \
            sqlalchemy alembic psycopg2-binary 'passlib[bcrypt]' itsdangerous redis loguru uvicorn
          pip install -e packages/contracts packages/shared packages/database \
            integrations/wigolo integrations/money-printer-turbo \
            apps/api apps/discovery-worker apps/local-render-agent
      - name: Lint
        run: ruff check packages apps integrations tests
      - name: Format check
        run: ruff format --check packages apps integrations tests
      - name: Test
        run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx --no-install tsc --noEmit
