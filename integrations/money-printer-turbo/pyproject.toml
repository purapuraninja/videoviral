[project]
name = "vvf-mpt"
version = "0.1.0"
description = "MoneyPrinterTurbo API adapter and output parser"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "vvf-contracts",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
