[project]
name = "vvf-wigolo"
version = "0.1.0"
description = "wigolo adapter: local-first web search/fetch/extract result mapper"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "vvf-contracts",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
