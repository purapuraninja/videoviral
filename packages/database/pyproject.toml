[project]
name = "vvf-database"
version = "0.1.0"
description = "SQLAlchemy models and Alembic migrations for Viral Video Factory"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "bcrypt>=4",
    "pydantic>=2.6",
    "vvf-contracts",
    "vvf-shared",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
