[project]
name = "vvf-shared"
version = "0.1.0"
description = "Shared logging, config, and security utilities for VVF"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
