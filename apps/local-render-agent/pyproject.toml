[project]
name = "vvf-local-agent"
version = "0.1.0"
description = "VVF local render agent: claims jobs, drives MoneyPrinterTurbo, serves Tailscale preview, publishes to platforms"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "vvf-contracts",
    "vvf-shared",
    "vvf-mpt",
    "vvf-publishers",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
vvf-local-agent = "vvf_local_agent.main:main"
