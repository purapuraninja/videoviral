# Viral Video Factory — production stack for the VPS.
# - API + dashboard bound to 127.0.0.1 (nginx reverse-proxies the public domains)
# - Data services not published publicly
# - wigolo opt-in via the "wigolo" profile; discovery uses mock by default
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/viral-video-factory/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - /opt/viral-video-factory/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      VVF_PUBLIC_API_URL: ${VVF_PUBLIC_API_URL:-https://api.purapuraninja.my.id}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: http://api:8000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # wigolo: local-first web search/fetch/extract (AGPL-3.0, never modified).
  # `serve` exposes a REST API at /v1/{tool} plus /health. Binding off-loopback
  # requires a bearer token, so WIGOLO_API_TOKEN must be set in .env.
  # The :full tag preinstalls the browser engine (needed for JS-heavy result pages).
  wigolo:
    image: ghcr.io/knockoutez/wigolo:full
    restart: unless-stopped
    profiles: ["wigolo"]
    command: ["serve", "--host", "0.0.0.0", "--port", "3333"]
    environment:
      WIGOLO_API_TOKEN: ${WIGOLO_API_TOKEN:?set WIGOLO_API_TOKEN in .env}
      # Keyless search/fetch/extract; an LLM is only needed for research/agent
      # synthesis, which the discovery pipeline does not use.
      WIGOLO_SEARCH: ${WIGOLO_SEARCH:-default}
      WIGOLO_EAGER_WARMUP: "1"
    volumes:
      - /opt/viral-video-factory/data/wigolo:/data
    healthcheck:
      # /health is always open (no token) — safe for container healthchecks.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  discovery-worker:
    build:
      context: .
      dockerfile: apps/discovery-worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      VVF_WIGOLO_BASE_URL: ${VVF_WIGOLO_BASE_URL:-http://wigolo:3333}
      VVF_WIGOLO_API_TOKEN: ${WIGOLO_API_TOKEN:-}
      VVF_WIGOLO_USE_MOCK: ${VVF_WIGOLO_USE_MOCK:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
